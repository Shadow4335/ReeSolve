# Render Blueprint: deploys the FastAPI backend as a free web service.
# Render dashboard: New > Blueprint > pick this repository. The frontend is deployed separately on Vercel
# (see docs/deployment.md).
services:
  - type: web
    name: reesolve-api
    runtime: python
    plan: free
    region: singapore            # closest free region to India; any region works
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # ONE worker on purpose: the simulated clock lives in process memory and the SLA watchdog is a background
    # thread, so multiple workers would disagree about the time.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTO_SEED             # free-tier disk is ephemeral: reload the demo data on every cold start
        value: "true"
      - key: CORS_ORIGINS          # set in the dashboard after the Vercel URL exists
        sync: false
